[['HTML: headings, links, forms, semantic tags','CSS: box model, flexbox, grid, media queries','Design for mobile first','Rebuild 3 real websites for practice'],[['HTML full course',yw('pQN-pnXPaVg')],['CSS full course',yw('ieTHC78giGQ')]]],'JavaScript':[['Variables, functions, arrays, objects, loops','The DOM and events','Async code: promises, async/await, fetch','Build a to-do app, then a weather app'],[['JavaScript full course (freeCodeCamp)',yw('PkZNo7MFNFg')],['JavaScript crash course (Traversy Media)',yw('hdI2bqOjy3c')]]],'React':[['Components, props and JSX','State with useState, effects with useEffect','Lists, forms and routing','Build one app that calls a real API'],[['Search: React course for beginners',ys('freeCodeCamp React course for beginners')]]],'Node.js':[['Modules, npm and the event loop','Express: routes, middleware, REST APIs','Connect a database and validate input','Add login with JWT'],[['Search: Node.js and Express course',ys('freeCodeCamp Node.js and Express.js full course')]]],'Databases':[['Tables, keys, relationships, normalisation','SQL vs NoSQL: when to use which','Indexes and transactions at a basic level','Design the schema for an app you build'],[['SQL full course (freeCodeCamp)',yw('HXV3zeQKqGY')]]],'SQL':[['SELECT, WHERE, ORDER BY, GROUP BY','JOINs, subqueries and aggregates','Practise on a real dataset','Then learn window functions'],[['SQL full course (freeCodeCamp)',yw('HXV3zeQKqGY')]]],'Maths':[['Linear algebra: vectors and matrices','Probability and statistics basics','Calculus: derivatives and gradients','Apply each idea in Python with NumPy'],[['Search: Essence of Linear Algebra',ys('3Blue1Brown Essence of linear algebra')]]],'ML Basics':[['Supervised vs unsupervised learning','Train/test split, overfitting, metrics','scikit-learn: regression, trees, clustering','Finish one beginner Kaggle project'],[['Search: Machine Learning for Everybody',ys('freeCodeCamp Machine Learning for Everybody full course')]]],'Deep Learning':[['N proj(){return `<h1>Smart project recommender</h1><p class="sub">Ranked by how many of your gaps each project closes.</p><div class="grid g2">${recs().map(p=>`<div class="c"><div class="row"><b>${p.n}</b><span class="mut">${p.d}</span></div><div>${p.s.map(k=>`<span class="tag">${k}</span>`).join("")}</div><div class="mut" style="margin:6px 0">Closes ${p.sc} gap points</div><button class="btn ${S.proj[p.n]?"g":""}" onclick="S.proj['${p.n}']=!S.proj['${p.n}'];go('proj')">${S.proj[p.n]?"Built ✓ (undo)":"Mark as built"}</button></div>`).join("")}</div>`},
team(){const g=gaps().filter(x=>x.g).map(x=>x.k);const m=T.map(t=>({t,sc:g.length?pct(t[2].filter(k=>g.includes(k)).length,Math.min(g.length,4)):50})).sort((a,b)=>b.sc-a.sc);
return `<h1>Team match</h1><p class="sub">Teammates whose strengths cover your gaps. Sample profiles shown.</p><div class="grid g2">${m.map(({t,sc})=>`<div class="c"><div class="row"><b>${t[0]}</b><span class="num" style="font-size:20px">${Math.min(sc,100)}%</span></div><div class="mut">${t[1]}</div>${bar(Math.min(sc,100),"ok")}<div style="margin-top:8px">${t[2].map(k=>`<span class="tag">${k}</span>`).join("")}</div></div>`).join("")}</div>`},
port(){const sk=gaps().filter(x=>x.l>=3).map(x=>x.k),pj=Object.keys(S.proj).filter(k=>S.proj[k]);
return `<h1>Portfolio builder</h1><p class="sub">Built from your skills and finished projects.</p><div class="grid g2"><div class="c"><h2>Edit</h2><label class="mut">Name<input value="${S.name}" oninput="S.name=this.value;pv()"></label><label class="mut">One-line bio<textarea rows="3" oninput="S.bio=this.value;pv()">${S.bio}</textarea></label><p class="mut">Skills at level 3+ and projects marked built appear automatically.</p></div><div class="c" id="pv">${pvh(sk,pj)}</div></div>`},
dash(){const st=steps(),d=st.filter(s=>S.done[s.id]).length,g=gaps().filter(x=>x.g),nx=st.find(s=>!S.done[s.id]),pr=recs()[0],pd=Object.keys(S.proj).filter(k=>S.proj[k]).length,y=Y[S.yr],wk=Math.max(0,Math.ceil((st.length-d)*4/S.hrs));
const hk=H[0][0]+', '+H[0][2];
return `<div class="banner"><div class="ring" style="--p:${ready()}"><b>${ready()}%</b></div><div style="flex:1;min-width:220px"><h1>Hi ${S.name} 👋</h1><p>${g.length?`Your biggest gap is <b>${g[0].k}</b>. Close it first for the fastest jump.`:'You meet every skill target. Time to apply.'}</p><span class="pill">🎯 ${R[S.role].n}</span><span class="pill">🎓 Year ${S.yr}</span><span class="pill">📍 ${S.city}</span><span class="pill">⏱ About ${wk} weeks at ${S.hrs} h a week</span></div></div>
<div class="grid g4" style="margin-bottom:14px"><div class="c stat"><div class="ic" style="background:#e7ecff">✅</div><div><div class="num">${d}/${st.length}</div><div class="mut">Steps done</div></div></div><div class="c stat"><div class="ic" style="background:#fff3d6">⚠️</div><div><div class="num">${g.length}</div><div class="mut">Skills to close</div></div></div><div class="c stat"><div class="ic" style="background:#d3f9e8">🛠️</div><div><div class="num">${pd}</div><div class="mut">Projects built</div></div></div><div class="c stat"><div class="ic" style="background:#ffe3e3">🏆</div><div><div class="num">${H.length}</div><div class="mut">Hackathons for you</div></div></div></div>
<div class="grid g2">${extra()}<div class="c" style="grid-column:1/-1"><h2>Year ${S.yr} plan: ${y[0]}</h2><div class="tl">${y[1].map(t=>cbx('y'+S.yr+t,t,'','dash')).join('')}</div></div>
<div class="c"><h2>Do this next</h2>${nx?`<p style="margin:0 0 10px"><b>${nx.t}</b></p><button class="btn" onclick="go('road')">Open roadmap</button>`:'<p class="mut">All skill steps done.</p>'}</div>
<div class="c"><h2>Top skill gaps</h2>${g.slice(0,3).map(x=>`<div class="row"><span>${x.k}</span><span class="mut">level ${x.l} of ${x.r}</span></div>${bar(pct(x.l,x.r),'w')}`).join('')||'<p class="mut">No gaps.</p>'}</div>
<div class="c"><h2>Best project for you</h2><b>${pr.n}</b> <span class="mut">${pr.d}</span><div>${pr.s.map(k=>`<span class="tag">${k}</span>`).join('')}</div><button class="btn g" style="margin-top:8px" onclick="go('proj')">See all</button></div>
<div class="c"><h2>Featured hackathon</h2><b>${hk}</b><div class="mut">Verified listing. Open the finder for ${S.city}</div><button class="btn g" style="margin-top:8px" onclick="go('hack')">Browse hackathons</button></div></div>
<p class="mut" style="margin-top:16px"><a href="#" onclick="S.ok=false;go('dash');return false">Retake assessment</a> · <a href="#" onclick="if(!confirm('Delete your saved account on this device?'))return false;try{const u=US();delete u[S.uid];localStorage.setItem('ssai2',JSON.stringify(u));sessionStorage.removeItem('ssuid')}catch(e){}location.reload();return false">Reset all data</a> · <a href="#" onclick="logout();return false">Log out</a><br>Hackathon listings and videos can change, so always confirm on the official page.</p>`},
road(){const st=steps(),y=Y[S.yr];return `<h1>Skill roadmap</h1><p class="sub">Plan for a Year ${S.yr} student aiming for ${R[S.role].n}.</p><div class="c" style="margin-bottom:14px"><h2>Year ${S.yr}: ${y[0]}</h2>${y[1].map(t=>cbx('y'+S.yr+t,t,'','road')).join('')}</div><div class="c"><h2>Skill steps, biggest gaps first</h2>${st.map(s=>cbx(s.id,s.t,` <i class="tag">Week ${s.w}</i>`,'road')).join('')||'<p class="mut">No steps left.</p>'}</div>`},
learn(){return `<h1>Learn and notes</h1><p class="sub">Study material for ${R[S.role].n}, biggest gaps first. Videos come from popular, beginner-friendly channels. Items marked Search open YouTube results for that course.</p><div class="grid g2">${gaps().map(x=>{const n=N[x.k]||[[],[]];return `<div class="c"><div class="row"><b>${x.k}</b><span class="tag">${x.g?'Gap '+x.g:'On target'}</span></div>${bar(pct(x.l,x.r),x.g?'w':'ok')}<ul style="padding-left:18px;margin:10px 0">${n[0].map(t=>`<li>${t}</li>`).join('')}</ul>${n[1].map(l=>`<a class="btn g" style="margin:0 6px 6px 0" href="${l[1]}" target="_blank" rel="noopener">▶ ${l[0]}</a>`).join('')}<a href="${ys(x.k+' tutorial in Hindi')}" target="_blank" rel="noopener" class="mut">Hindi videos</a></div>`}).join('')}</div>`},
hack(){const L=(l,u)=>`<a class="btn g" style="margin:0 8px 8px 0" href="${u}" target="_blank" rel="noopener">${l}</a>`;return `<h1>Hackathon finder</h1><p class="sub">Live searches for ${S.city}, plus verified listings (checked 30 Oct 2026).</p><div class="c" style="margin-bottom:14px"><h2>Search live near ${S.city}</h2>${L('Google: offline hackathons','https://www.google.com/search?q='+encodeURIComponent('offline hackathons in '+S.city+' 2026 for engineering students'))}${L('Google: next month','https://www.google.com/search?q='+encodeURIComponent('hackathons '+S.city+' November 2026'))}${L('Unstop','https://unstop.com/hackathons')}${L('Devfolio','https://devfolio.co/hackathons')}${L('Reskilll','https://reskilll.com/allhacks')}</div><div class="grid g2">${H.map(h=>`<div class="c"><b>${h[0]}</b><div class="mut">${h[1]} · ${h[2]} · ${h[3]}</div><div>${h[4].map(k=>`<span class="tag">${k}</span>`).join('')}</div></div>`).join('')}</div><p class="mut">${S.yr<3?'Year '+S.yr+' tip: join as a team of 3–4 and pick beginner-friendly events.':'Tip: pick events with sponsor hiring and mentors.'}</p>`},
login(){return `<div style="max-width:380px;margin:8vh auto 0"><div class="logo" style="margin-left:0"><i></i>SkillSphere AI</div><h1>Welcome back</h1><p class="sub">Log in to open your dashboard.</p><div class="c"><label class="mut">Name<input id="lnm" autocomplete="username"></label><br><br><label class="mut">Password<input id="lpw" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')dologin()"></label><p id="lerr" style="color:var(--bad);min-height:20px" role="alert"></p><button class="btn" onclick="dologin()">Log in</button></div><p class="mut" style="margin-top:14px">New here? <a href="#" onclick="S.mode='';go('dash');return false">Create an account</a></p></div>`},
onb(){if(S.auth&&!S.area){S.area=areaOf(S.role);S.pick=S.role}
return `<div style="max-width:620px;margin:0 auto"><div class="logo" style="margin-left:0"><i></i>SkillSphere AI</div><h1>Let\u2019s build your plan</h1>${S.auth?'':`<p class="mut">Already have an account? <a href="#" onclick="S.mode='login';go('dash');return false">Log in</a></p>`}<p class="sub">Four quick steps. Your dashboard is built from your answers.</p><div class="c" style="margin-bottom:14px"><h2>1. About you</h2><label class="mut">Your name<input id="nm" value="${S.name=='Student'?'':S.name}" placeholder="e.g. Riya"></label><br><br>${S.pw?'':`<label class="mut">Create a password (6+ characters)<input id="pw1" type="password" autocomplete="new-password"></label><br><br><label class="mut">Confirm password<input id="pw2" type="password" autocomplete="new-password"></label><br><br>`}<label class="mut">Academic year (B.Tech)<select id="yr">${[1,2,3,4].map(y=>`<option value="${y}" ${y==S.yr?'selected':''}>Year ${y}</option>`).join('')}</select></label><br><br><label class="mut">Your city<input id="ct" value="${S.city}" placeholder="e.g. Hyderabad"></label><br><br><label class="mut">Study time per week<select id="hr">${[3,6,10,15].map(h=>`<option value="${h}" ${h==S.hrs?'selected':''}>${h} hours</option>`).join('')}</select></label></div><div class="c" style="margin-bottom:14px"><h2>2. Pick your major area</h2><div class="chips" id="ar" style="margin:0">${arH()}</div></div><div id="dyn">${dynH()}</div><p id="err" style="color:var(--bad)" role="alert"></p><button class="btn" onclick="sub()">Build my dashboard</button></div>`},
int(){const q=Q[S.qi];return `<h1>Interview practice</h1><p class="sub">Question ${S.qi+1} of ${Q.length}. Answer in your own words, then get feedback.</p><div class="c"><h2>${q[0]}</h2><textarea id="ans" rows="6" placeholder="Type your answer here"></textarea><div class="row" style="margin-top:10px"><button class="btn" onclick="ev()">Get feedback</button><button class="btn g" onclick="S.qi=(S.qi+1)%Q.length;S.fb=null;go('int')">Next question</button></div>${S.fb?`<div style="margin-top:14px"><div class="row"><b>Score</b><b>${S.fb.s}/100</b></div>${bar(S.fb.s,S.fb.s>=60?"ok":"w")}<p>${S.fb.m}</p></div>`:""}</div>`}};
function pvh(sk,pj){sk=sk||gaps().filter(x=>x.l>=3).map(x=>x.k);pj=pj||Object.keys(S.proj).filter(k=>S.proj[k]);return `<h2 style="font-size:22px;margin:0">${S.name}</h2><p class="mut">${S.bio}</p><b>Skills</b><div>${sk.map(k=>`<span class="tag">${k}</span>`).join("")||'<span class="mut">Raise a skill to level 3 to show it here.</span>'}</div><b>Projects</b><div>${pj.map(k=>`<div>• ${k}</div>`).join("")||'<span class="mut">Mark a project as built to add it.</span>'}</div>`}
function pv(){document.getElementById("pv").innerHTML=pvh()}
function ev(){const a=document.getElementById("ans").value.toLowerCase(),w=a.trim().split(/\s+/).filter(Boolean).length,k=Q[S.qi][1],h=k.filter(x=>a.includes(x)),s=Math.min(100,Math.round(Math.min(w,60)/60*40+h.length/k.length*60));
S.fb={s,m:w<20?"Too short. Aim for 40+ words with one concrete example.":h.length<k.length/2?`Good start. Also cover ideas like: ${k.filter(x=>!h.includes(x)).slice(0,3).join(", ")}.`:"Strong answer. Keep it structured: context, action, result."};go("int")}
async function sub(){if(!document.getElementById("ct").value.trim()){document.getElementById("err").textContent="Please enter your city.";document.getElementById("ct").focus();return}if(!S.pw){const nm=document.getElementById("nm").value.trim();if(!nm||US()[nm.toLowerCase()]){document.getElementById("err").textContent=nm?"That name is already registered here. Please log in instead.":"Please enter your name.";return}const a=document.getElementById("pw1").value;if(a.length<6||a!==document.getElementById("pw2").value){document.getElementById("err").textContent=a.length<6?"Password must be at least 6 characters.":"Passwords do not match.";return}}const rl=document.getElementById("rl");if(!rl||!rl.value){document.getElementById("err").textContent="Please choose your major area and role.";return}const s=[...document.querySelectorAll("[data-k]")],m=s.filter(x=>x.value==="");if(m.length){document.getElementById("err").textContent=`Please answer ${m.length} more skill${m.length>1?"s":""} to continue.`;m[0].focus();return}
s.forEach(x=>S.lv[x.dataset.k]=+x.value);S.name=document.getElementById("nm").value.trim()||"Student";S.role=document.getElementById("rl").value;S.yr=+document.getElementById("yr").value;S.city=document.getElementById("ct").value.trim();S.hrs=+document.getElementById("hr").value;if(!S.pw){const sl=Math.random().toString(36).slice(2);S.pw={s:sl,h:await hp(sl,document.getElementById("pw1").value)};S.auth=true;S.uid=document.getElementById("nm").value.trim().toLowerCase();try{sessionStorage.setItem("ssuid",S.uid)}catch(e){}}S.done={};S.area="";S.pick="";S.tmp={};S.ok=true;scrollTo(0,0);go("dash")}
function sv(){try{const{ok,name,role,yr,city,hrs,lv,done,proj,bio,pw,hist}=S;if(!S.uid)return;const u=US();u[S.uid]={ok,name,role,yr,city,hrs,lv,done,proj,bio,pw,hist};localStorage.setItem('ssai2',JSON.stringify(u))}catch(e){}}
function go(t){if(!S.auth&&S.mode=="login"){document.body.classList.add("ob");document.getElementById("v").innerHTML=V.login();return}sv();if(S.ok&&ready()==100&&!S.hist.some(h=>h.r==S.role))S.hist.push({r:S.role,d:new Date().toLocaleDateString()});if(!S.ok)t="onb";S.t=t;document.body.classList.toggle("ob",!S.ok);document.getElementById("nav").innerHTML=`<div class="logo"><i></i>SkillSphere AI</div>`+tabs.map(x=>`<button class="${x[0]==t?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")+(S.pw?`<button onclick="logout()" style="margin-top:10px;color:var(--bad)">Log out</button>`:"");document.getElementById("v").innerHTML=V[t]();if(t=="int")document.getElementById("ans").focus()}
try{const id=sessionStorage.getItem('ssuid'),d=US()[id];if(id&&d){Object.assign(S,d);S.uid=id;S.auth=true}}catch(e){}

go("dash");
</script></body></html>
